    <title>Acesso Restrito | Plasticlinic</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fbf9f6;
            color: #4a3b32;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 750px;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(74, 59, 50, 0.05);
            /* Removido completamente o border-top (faixa marrom do topo) */
            text-align: center;
        }

        .logo-area {
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-img {
            max-height: 200px;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            color: #4a3b32;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
        }

        .divider {
            width: 90px;
            height: 5px;
            background-color: #4a3b32;
            margin: 0 auto 30px auto;
            border-radius: 3px;
        }

        .message {
            font-size: 21px;
            line-height: 1.6;
            color: #6e5d53;
            max-width: 620px;
            margin: 0 auto 40px auto;
        }

        .message strong {
            color: #4a3b32;
            font-weight: 700;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            background-color: #25d366;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 36px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.2);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-whatsapp:hover {
            background-color: #20ba5a;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            margin-right: 12px;
        }

        .footer {
            margin-top: 45px;
            font-size: 11px;
            color: #bfae9e;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-top: 1px solid #f5f2ee;
            padding-top: 20px;
        }
    </style>
